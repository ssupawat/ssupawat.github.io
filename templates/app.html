<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>art.</title>
        <meta name="description" content="{{description}}" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="art." />
        <meta property="og:description" content="{{description}}" />
        <meta property="og:image" content="https://ssupawat.github.io/assets/og-image.png?v={{ogVersion}}" />
        <meta property="og:url" content="https://ssupawat.github.io/" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" />
        <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
        <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
        <link rel="stylesheet" href="assets/style.css?v={{cssVersion}}" />
        <link rel="alternate" type="application/atom+xml" title="art." href="atom.xml" />
        <link rel="alternate" type="application/json" title="art." href="feed.json" />
        <link rel="sitemap" type="application/xml" title="Sitemap" href="sitemap.xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
</head>
    <body>
        <main class="container">
            <nav>
                <a href="#/" class="logo" aria-label="Home">
                    <div class="logo-inner">
                        <img src="assets/favicon.svg" alt="" width="32" height="32" class="logo-mark" />
                        <span class="logo-text">art.</span>
                    </div>
                </a>
                <div class="menu">
                    <a href="#/about" class="menu-icon" aria-label="About me"><span class="material-symbols-outlined">person</span>
                    </a>
                    <button
                        class="menu-icon"
                        id="theme-toggle"
                        aria-label="Toggle dark mode"
                    ><span class="material-symbols-outlined" id="theme-icon">light_mode</span>
                    </button>
                </div>
            </nav>

            <div id="app"></div>

            <footer class="footer" id="footer">
                {{projects}}
                <div class="social-links">
                    <a
                        href=""
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-icon"
                        aria-label="GitHub"
                        data-social="github"
                    ><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                    </a>
                    <a
                        href=""
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-icon"
                        aria-label="Facebook"
                        data-social="facebook"
                    ><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                    </a>
                    <a
                        href=""
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-icon"
                        aria-label="RSS feed"
                        data-social="rss"
                    ><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
                    </a>
                </div>
            </footer>
        </main>
        <script>
            // Posts data embedded in HTML
            const posts = {{posts}};

            // About page content
            const aboutContent = {{about}};

            // Config data
            const config = {{config}};

            // Theme handling
            const themeToggle = document.getElementById("theme-toggle");
            const html = document.documentElement;

            // Only the choice lives here; the colours belong to the
            // stylesheet, which keys off this attribute.
            function setTheme(theme) {
                html.setAttribute("data-theme", theme);
                localStorage.setItem("theme", theme);
                const ti = document.getElementById("theme-icon");
                if (ti) ti.textContent = theme === "dark" ? "dark_mode" : "light_mode";
            }

            const savedTheme = localStorage.getItem("theme");
            const systemPrefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)",
            ).matches;

            if (savedTheme) {
                setTheme(savedTheme);
            } else if (systemPrefersDark) {
                setTheme("dark");
            }

            themeToggle.addEventListener("click", () => {
                const currentTheme =
                    localStorage.getItem("theme") ||
                    (systemPrefersDark ? "dark" : "light");
                setTheme(currentTheme === "dark" ? "light" : "dark");
            });

            // Set social links from config
            function setSocial(key, href) {
                const link = document.querySelector(
                    `#footer .social-links a[data-social="${key}"]`,
                );
                if (link && href) link.href = href;
            }
            setSocial("github", config.social.github);
            setSocial("facebook", config.social.facebook);
            setSocial("rss", config.site.url ? config.site.url + "/atom.xml" : "");

            // Router
            const app = document.getElementById("app");

            function postListHtml(list) {
                return list
                    .map((post) => {
                        return `<li class="post-list-item">
                            <div>
                                <a href="#/${post.slug}" class="post-title">${post.title}</a>
                                <div class="post-description">${post.description}</div>
                                <div class="post-tags">${(post.tags || []).map(t => `<a href="#/tag/${t}" class="tag">${t}</a>`).join("")}</div>
                            </div>
                            <div class="post-meta">${post.date}</div>
                        </li>`;
                    })
                    .join("");
            }

            function renderHome(filter) {
                const query = (filter || "").trim().toLowerCase();

                if (posts.length === 0) {
                    app.innerHTML = config.site.tagline
                        ? `<p class="tagline">${config.site.tagline}</p>`
                        : "";
                    return;
                }

                app.innerHTML = `
                    ${config.site.tagline ? `<p class="tagline">${config.site.tagline}</p>` : ""}
                    <div class="home-wrapper">
                        <input
                            type="search"
                            id="search-input"
                            class="search-input"
                            placeholder="Search posts..."
                            aria-label="Search posts"
                            autocomplete="off"
                        />
                        <h2>Posts</h2>
                        <ul class="post-list" id="post-list"></ul>
                        <p class="empty-state" id="search-empty" hidden>No posts match your search.</p>
                    </div>
                `;

                const list = document.getElementById("post-list");
                const emptyEl = document.getElementById("search-empty");
                const searchInput = document.getElementById("search-input");

                function applyQuery(value) {
                    const q = value.trim().toLowerCase();
                    const filtered = q
                        ? posts.filter((p) =>
                              `${p.title} ${p.description} ${p.content.replace(/<[^>]+>/g, " ")}`
                                  .toLowerCase()
                                  .includes(q),
                          )
                        : posts;
                    list.innerHTML = postListHtml(filtered);
                    emptyEl.hidden = !(q && filtered.length === 0);
                }

                searchInput.addEventListener("input", (e) => applyQuery(e.target.value));
                applyQuery(filter || "");
                if (query) searchInput.focus();
            }

            function renderPost(slug) {
                const post = posts.find((p) => p.slug === slug);
                if (!post) {
                    app.innerHTML = `
                        <article>
                            <header class="post-header">
                                <h1>Post Not Found</h1>
                            </header>
                            <div class="content">
                                <p>Sorry, the post you're looking for doesn't exist.</p>
                                <p><a href="#/">← Back to home</a></p>
                            </div>
                        </article>
                    `;
                    return;
                }

                const idx = posts.findIndex((p) => p.slug === slug);
                const newer = idx > 0 ? posts[idx - 1] : null;
                const older = idx < posts.length - 1 ? posts[idx + 1] : null;

                const navHtml =
                    newer || older
                        ? `
                        <nav class="post-nav">
                            <div class="post-nav-item">
                                ${
                                    newer
                                        ? `<span class="post-nav-arrow">← Newer</span><a href="#/${newer.slug}" class="post-nav-title">${newer.title}</a>`
                                        : ""
                                }
                            </div>
                            <div class="post-nav-item post-nav-right">
                                ${
                                    older
                                        ? `<a href="#/${older.slug}" class="post-nav-title">${older.title}</a><span class="post-nav-arrow">Older →</span>`
                                        : ""
                                }
                            </div>
                        </nav>`
                        : "";

                app.innerHTML = `
                    <article>
                        <header class="post-header">
                            <h1>${post.title}</h1>
                            <div class="meta">
                                <span class="date">${post.date}</span>
                                <span class="description">${post.description}</span>
                            </div>
                            <span class="post-tags">${post.tags && post.tags.length ? post.tags.map(t => `<a href="#/tag/${t}" class="tag">${t}</a>`).join("") : ""}</span>
                        </header>
                        <button class="share-post" id="share-btn" title="Copy share link"><span class="material-symbols-outlined">link</span></button>
                        <div class="content">${post.content}</div>
                        ${navHtml}
                    </article>
                `;

                const shareBtn = document.getElementById("share-btn");
                if (shareBtn) {
                    shareBtn.addEventListener("click", () => {
                        const url = config.site.url + "/posts/" + post.slug + "/";
                        if (navigator.share) {
                            navigator.share({ title: post.title, url });
                        } else {
                            navigator.clipboard.writeText(url).then(() => {
                                shareBtn.textContent = "Copied!";
                                setTimeout(() => {
                                    shareBtn.innerHTML = '<span class="material-symbols-outlined">link</span>';
                                }, 1500);
                            });
                        }
                    });
                }
            }

            function renderTaggedPosts(tag) {
                const filtered = posts.filter((p) => (p.tags || []).includes(tag));
                app.innerHTML = `
                    <p class="tagline">#${tag}</p>
                    <div class="home-wrapper">
                        <ul class="post-list">
                            ${postListHtml(filtered)}
                        </ul>
                        ${filtered.length === 0 ? '<p class="empty-state">No posts with this tag.</p>' : ""}
                    </div>
                `;
            }

            function router() {
                // A malformed escape would otherwise throw and take the whole
                // route with it, so fall back to the raw hash.
                let raw = window.location.hash.slice(1);
                let hash;
                try {
                    hash = decodeURIComponent(raw) || "/";
                } catch (e) {
                    hash = raw || "/";
                }

                if (hash === "/") {
                    renderHome();
                } else if (hash.startsWith("/tag/")) {
                    renderTaggedPosts(hash.slice(5));
                } else if (hash === "/about") {
                    app.innerHTML = `
                        <article>
                            <div class="content about-content">
                                ${aboutContent}
                            </div>
                        </article>
                    `;
                } else {
                    const slug = hash.slice(1);
                    renderPost(slug);
                }

                // Update page title
                const post = posts.find((p) => hash === "/" + p.slug);
                if (post) {
                    document.title = `${post.title} - art.`;
                } else if (hash === "/") {
                    document.title = `art.`;
                } else if (hash === "/about") {
                    document.title = `art. - About Me`;
                }
            }

            // Listen for hash changes
            window.addEventListener("hashchange", router);

            // Initial render
            router();
        </script>
    </body>
</html>
